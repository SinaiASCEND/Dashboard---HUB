<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ASCEND Support Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<noscript><meta http-equiv="refresh" content="0; url=https://ascend-support-dashboard.vercel.app/"></noscript></head>
<body><p>Opening the <a href="https://ascend-support-dashboard.vercel.app/">ASCEND Support Dashboard</a>&hellip;</p>
<script>
var code = null;
try { code = sessionStorage.getItem('ascendCode'); } catch(_){}
if (code && "https://ascend-support-dashboard.vercel.app/api/unlock") {
  var f = document.createElement('form');
  f.method = 'post'; f.action = "https://ascend-support-dashboard.vercel.app/api/unlock";
  var add = function(n, v){ var i = document.createElement('input'); i.type = 'hidden'; i.name = n; i.value = v; f.appendChild(i); };
  add('code', code); add('to', "/");
  document.body.appendChild(f); f.submit();
} else {
  location.replace("https://ascend-support-dashboard.vercel.app/");
}
</script></body></html>
